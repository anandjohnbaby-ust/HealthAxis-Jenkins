<div class="page">

    <h1>Change Password</h1>

    @if(successMessage()){

    <div class="alert alert-success">
        {{successMessage()}}
    </div>

    }

    @if(errorMessage()){

    <div class="alert alert-error">
        {{errorMessage()}}
    </div>

    }

    <div class="card">

        <form
            [formGroup]="form"
            (ngSubmit)="changePassword()">

            <div class="field">

                <label>
                    Current Password
                </label>

                <input
                    type="password"
                    formControlName="currentPassword">

            </div>

            <div class="field">

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    formControlName="newPassword">

            </div>

            <div class="field">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    formControlName="confirmPassword">

            </div>

            <div class="actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                    [disabled]="changing()">

                    @if (changing()) {
                        Changing...
                    }
                    @else {
                        Change Password
                    }

                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    (click)="goBack()">

                    Back

                </button>

            </div>

        </form>

    </div>

</div>
