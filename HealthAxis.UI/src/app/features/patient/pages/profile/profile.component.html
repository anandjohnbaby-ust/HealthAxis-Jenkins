<!-- src/app/features/patient/pages/profile/profile.component.html -->

<div class="page">
  <h1>My Profile</h1>

  @if (loading()) {
    <p>Loading profile...</p>
  } @else {
    @if (successMessage()) {
      <div class="alert alert--success">
        {{ successMessage() }}
      </div>
    }

    @if (errorMessage()) {
      <div class="alert alert--error">
        {{ errorMessage() }}
      </div>
    }

    <section class="card">
      <h2>Personal Information</h2>

      <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
        <div class="form-grid">
          <div class="field">
            <label for="fullName">Full Name</label>

            <input id="fullName" type="text" formControlName="fullName" [readonly]="!editing()" />
          </div>

          <div class="field">
            <label for="email">Email</label>

            <input
              id="email"
              type="email"
              formControlName="email"
              readonly
              class="readonly-field"
            />
          </div>

          <div class="field">
            <label for="phoneNumber">Phone Number</label>
            <input
              id="phoneNumber"
              type="text"
              formControlName="phoneNumber"
              [readonly]="!editing()"
            />
          </div>

          <div class="field">
            <label for="dateOfBirth">Date of Birth</label>

            <input
              id="dateOfBirth"
              type="date"
              formControlName="dateOfBirth"
              [readonly]="!editing()"
            />
          </div>

          <div class="field">
            <label for="gender">Gender</label>

            @if (!editing()) {
              <input
                type="text"
                class="readonly-field"
                [value]="
                  genderOptions.find((g) => g.value === profileForm.get('gender')?.value)?.label
                "
                readonly
              />

            } @else {
              <select id="gender" formControlName="gender">
                <option [value]="0">Select Gender</option>

                <option [value]="1">Male</option>

                <option [value]="2">Female</option>

                <option [value]="3">Other</option>
              </select>
            }
          </div>
        </div>

        <div class="actions">
          @if (!editing()) {
            <button type="button" class="btn btn--primary" (click)="startEditing()">
              Edit Profile
            </button>

            <button type="button" class="btn btn--secondary" (click)="goToChangePassword()">
              Change Password
            </button>

          } @else {
            <button class="btn btn--primary" type="submit" [disabled]="savingProfile()">
              @if (savingProfile()) {
                Saving...
              } @else {
                Save Changes
              }
            </button>

            <button type="button" class="btn btn--secondary" (click)="cancelEditing()">
              Cancel
            </button>
          }
        </div>
      </form>
    </section>
  }
</div>
